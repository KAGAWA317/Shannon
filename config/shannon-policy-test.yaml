# Shannon Configuration with Policy Engine Enabled for Testing
# 启用策略引擎的 Shannon 配置（用于测试）
# This demonstrates the OPA Policy Engine Phase 0.5 implementation
# 演示 OPA 策略引擎阶段 0.5 的实现

service:
  port: 50052
  health_port: 8081
  graceful_timeout: "30s"

agents:
  max_concurrent: 5
  default_timeout: "30s"
  agent_core_endpoint: "agent-core:50051"
  llm_service_endpoint: "http://llm-service:8000"

# Policy Engine Configuration - ENABLED for testing
# 策略引擎配置 - 测试环境下启用
policy:
  enabled: true
  mode: "dry-run"  # Start with dry-run mode for testing 注：先以 dry-run 模式开始，用于测试
  path: "/app/config/opa/policies"
  fail_closed: false  # Allow requests if policy evaluation fails 注：策略评估失败时仍放行请求
  environment: "test"
  audit:
    enabled: true
    log_level: "info"
    include_input: true
    include_decision: true

health:
  enabled: true
  check_interval: "30s"
  timeout: "5s"
  port: 8081
  checks:
    redis:
      enabled: true
      critical: true
      timeout: "5s"
      interval: "30s"
    database:
      enabled: true
      critical: true
      timeout: "5s"
      interval: "30s"

temporal:
  host_port: "localhost:7233"
  namespace: "default"
  task_queue: "shannon-task-queue"
  timeout: "30s"

logging:
  level: "info"
  development: false
  encoding: "json"

degradation:
  enabled: true
  mode_downgrade:
    minor_degradation_rules:
      complex_to_standard: true
  fallback_behaviors:
    llm_generation: "cache"
    vector_search: "proceed"
    agent_execution: "degrade"
    result_synthesis: "proceed"
    session_update: "proceed"

# Vector DB Configuration - ENABLED for contextual retrieval testing
# 向量库配置 - 测试 context 检索时启用
vector:
  enabled: true
  host: ""
  port: 6333
  task_embeddings: "task_embeddings"
  tool_results: "tool_results"
  cases: "cases"
  document_chunks: "document_chunks"
  top_k: 5
  threshold: 0.5
  timeout: "5s"