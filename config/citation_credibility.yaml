# Citation Credibility Scoring Configuration
# 引用可信度评分配置
# Used by go/orchestrator/internal/metadata/citations.go
# 供 go/orchestrator/internal/metadata/citations.go 使用
#
# Scoring guidelines:
# 评分指南：
# - 0.85+: Highly authoritative (academic, government)
# - 0.85+：高度权威（学术、政府）
# - 0.70-0.80: Professional/reputable (major news, tech documentation)
# - 0.70-0.80：专业/可信（主流新闻、技术文档）
# - 0.60-0.70: General web content
# - 0.60-0.70：一般网页内容
# - 0.50-0.60: Social media, user-generated content
# - 0.50-0.60：社交媒体、用户生成内容
# - Below 0.50: Low credibility (use with caution)
# - 低于 0.50：可信度低（谨慎使用）

credibility_rules:
  # TLD-based rules (highest priority)
  # 基于 TLD 的规则（最高优先级）
  tld_patterns:
    - suffix: ".edu"
      score: 0.85
      description: "Educational institutions"

    - suffix: ".gov"
      score: 0.80
      description: "Government websites"

    - suffix: ".ac.uk"
      score: 0.85
      description: "UK academic institutions"

    - suffix: ".edu.au"
      score: 0.85
      description: "Australian educational institutions"

  # Domain-based rules (checked after TLD)
  # 基于域名的规则（在 TLD 之后检查）
  domain_groups:
    - category: "academic"
      score: 0.85
      domains:
        - "arxiv.org"
        - "pubmed.ncbi.nlm.nih.gov"
        - "ncbi.nlm.nih.gov"
        - "scholar.google.com"
        - "researchgate.net"
        - "sciencedirect.com"
        - "springer.com"
        - "nature.com"
        - "science.org"
        - "ieee.org"
        - "acm.org"
        - "jstor.org"
        - "wiley.com"
        - "elsevier.com"
        - "plos.org"
        - "frontiersin.org"
        - "biorxiv.org"
        - "medrxiv.org"

    - category: "news_tier1"
      score: 0.75
      description: "Major international news outlets"
      domains:
        - "nytimes.com"
        - "wsj.com"
        - "ft.com"
        - "reuters.com"
        - "apnews.com"
        - "bbc.com"
        - "bbc.co.uk"
        - "theguardian.com"
        - "washingtonpost.com"
        - "bloomberg.com"
        - "economist.com"
        - "npr.org"
        - "pbs.org"

    - category: "news_tier2"
      score: 0.70
      description: "Reputable news sources"
      domains:
        - "cnn.com"
        - "nbcnews.com"
        - "cbsnews.com"
        - "abcnews.go.com"
        - "usatoday.com"
        - "latimes.com"
        - "chicagotribune.com"
        - "time.com"
        - "theatlantic.com"
        - "newyorker.com"

    - category: "tech_documentation"
      score: 0.75
      description: "Official technical documentation"
      domains:
        - "github.com"
        - "docs.github.com"
        - "stackoverflow.com"
        - "developer.mozilla.org"
        - "w3.org"
        - "ietf.org"
        - "rfc-editor.org"
        - "kubernetes.io"
        - "docs.docker.com"
        - "aws.amazon.com"
        - "cloud.google.com"
        - "docs.microsoft.com"

    - category: "tech_news"
      score: 0.70
      description: "Technology news and analysis"
      domains:
        - "techcrunch.com"
        - "theverge.com"
        - "arstechnica.com"
        - "wired.com"
        - "zdnet.com"
        - "cnet.com"
        - "engadget.com"
        - "techmeme.com"

    - category: "tech_community"
      score: 0.65
      description: "Developer community platforms"
      domains:
        - "medium.com"
        - "dev.to"
        - "hackernoon.com"
        - "substack.com"

    - category: "reference"
      score: 0.70
      description: "Reference and encyclopedic sources"
      domains:
        - "wikipedia.org"
        - "britannica.com"
        - "merriam-webster.com"
        - "dictionary.com"

    - category: "social_media"
      score: 0.50
      description: "Social media platforms"
      domains:
        - "twitter.com"
        - "x.com"
        - "facebook.com"
        - "linkedin.com"
        - "reddit.com"
        - "instagram.com"
        - "tiktok.com"
        - "youtube.com"

    - category: "forums"
      score: 0.55
      description: "Discussion forums and Q&A"
      domains:
        - "quora.com"
        - "stackexchange.com"
        - "news.ycombinator.com"
        - "lobste.rs"

  # Default score for unknown domains
  # 未知域名的默认分数
  default_score: 0.60

# Quality gates for citation filtering
# 引用过滤的质量门槛
quality_gates:
  min_credibility_score: 0.50  # Minimum to be included 注：被收录的最低分
  preferred_score: 0.70         # Preferred threshold for research 注：research 场景的偏好阈值
  high_quality_score: 0.80      # High-quality threshold 注：高质量阈值

# Source diversity rules
# 来源多样性规则
diversity_rules:
  max_per_domain: 50             # Maximum citations from same domain (increased for subpage fetch scenarios) 注：同一域名最多引用数（为子页面抓取场景已调高）
  min_unique_domains: 5          # Target minimum unique domains 注：目标最少独立域名数
  diversity_bonus: 0.05          # Bonus for diverse sources 注：来源多样性的加分
